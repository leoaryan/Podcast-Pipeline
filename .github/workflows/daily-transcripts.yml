name: Daily podcast transcripts

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-transcripts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: daily-podcast-transcripts
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure git author
        run: |
          git config user.name "podcast-transcript-bot"
          git config user.email "actions@github.com"

      - name: Fetch transcripts
        run: python scripts/fetch_transcripts.py --push --log
